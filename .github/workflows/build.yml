name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build installer
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Create checksum
        shell: pwsh
        run: |
          $exe = "release/Obhod-Setup-${{ steps.version.outputs.value }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  $([IO.Path]::GetFileName($exe))" | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Pick release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: pwsh
        run: |
          $notes = "releases/${{ github.ref_name }}.md"
          if (Test-Path $notes) {
            "custom=true" >> $env:GITHUB_OUTPUT
            "path=$notes" >> $env:GITHUB_OUTPUT
          } else {
            "custom=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obhod-Setup-${{ steps.version.outputs.value }}
          path: |
            release/Obhod-Setup-${{ steps.version.outputs.value }}.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.custom == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Обход ${{ steps.version.outputs.value }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release/Obhod-Setup-${{ steps.version.outputs.value }}.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Publish GitHub Release (generated notes)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.custom != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Обход ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            release/Obhod-Setup-${{ steps.version.outputs.value }}.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
