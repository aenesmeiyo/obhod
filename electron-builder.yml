appId: ru.obhod.app
productName: Obhod
copyright: Obhod
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# No native modules are used; skipping rebuild also avoids requiring a compiler.
npmRebuild: false
asarUnpack:
  - resources/**
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # The app must start for every user, even when UAC is disabled or the account
  # is not an administrator. Elevation is requested only when Zapret needs it.
  requestedExecutionLevel: asInvoker
  artifactName: Obhod-Setup-${version}.exe
nsis:
  # One click: no install-mode or directory questions. Per-machine: the app is
  # installed once for every Windows user in Program Files.
  oneClick: true
  perMachine: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Обход
  installerLanguages:
    - ru_RU
  language: '1049'
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Обход
  runAfterFinish: true
